<!doctype html><html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Administration | Echo Cinema</title><link rel="stylesheet" href="assets/css/style.css"></head>
<body><header class="site-header"><a class="brand" href="/">Echo <span>Cinema</span></a><nav class="site-nav"><a href="/">Movies</a><a id="historyLink" class="hidden" href="history.html">My bookings</a><a id="adminLink" class="hidden" href="admin.html">Admin</a><a id="loginLink" class="hidden" href="login.html">Log in</a><span id="navUser" class="demo-user">Loading…</span></nav></header>
<main><div class="page-heading compact-heading"><h1>Administration</h1><p>Manage catalogue data, create showtimes, and review bookings.</p></div><div id="adminCounts" class="stat-grid"></div><p id="adminFeedback" class="feedback"></p>
<section class="admin-grid"><form id="movieForm" class="panel form-grid"><h2>Add movie</h2><label>Title<input id="movieTitleInput" required maxlength="160"></label><label>Slug<input id="movieSlugInput" required maxlength="120" placeholder="example-movie"></label><label>Genre<input id="movieGenreInput" required maxlength="160"></label><label>Description<textarea id="movieDescriptionInput" required maxlength="2000"></textarea></label><label>Keywords<input id="movieKeywordsInput" maxlength="500"></label><div class="form-row"><label>Duration<input id="movieDurationInput" type="number" min="1" required></label><label>Rating<input id="movieRatingInput" type="number" min="0" max="10" step="0.1" required></label></div><div class="form-row"><label>Certificate<input id="movieCertificateInput" required></label><label>Price (€)<input id="moviePriceInput" type="number" min="0" step="0.01" required></label></div><button class="button" type="submit">Add movie</button></form>
<form id="showtimeForm" class="panel form-grid"><h2>Add showtime</h2><label>Movie<select id="showtimeMovie" required></select></label><label>Screen<select id="showtimeScreen" required></select></label><label>Start time<input id="showtimeStart" type="datetime-local" required></label><label>Price (€)<input id="showtimePrice" type="number" min="0" step="0.01" required></label><button class="button" type="submit">Add showtime</button></form></section>
<section class="panel table-panel"><h2>Recent bookings</h2><div class="table-scroll"><table><thead><tr><th>Reference</th><th>Customer</th><th>Movie</th><th>Seats</th><th>Status</th><th>Action</th></tr></thead><tbody id="adminBookings"></tbody></table></div></section></main>
<footer>Software Engineering CA2 — Bobo Nikolov — Student ID 24109479</footer><script src="assets/js/api.js"></script><script src="assets/js/nav.js"></script><script src="assets/js/admin.js"></script></body></html>
