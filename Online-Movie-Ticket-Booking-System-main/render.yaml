services:
  - type: web
    name: echo-cinema
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run db:setup
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: echo-cinema-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_MODE
        value: demo
      - key: SEAT_HOLD_MINUTES
        value: "15"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

databases:
  - name: echo-cinema-db
    region: frankfurt
    plan: basic-256mb
    databaseName: echo_cinema
    user: echo_cinema
